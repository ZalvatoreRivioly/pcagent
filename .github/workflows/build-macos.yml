name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller websockets psutil

      - name: Compilar binario unico (onefile)
        run: pyinstaller --onefile --windowed --clean --noconfirm --name "PCTaller-Diagnostics" --hidden-import websockets --hidden-import psutil --hidden-import tkinter --hidden-import tkinter.scrolledtext agent_client_macos.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PCTaller-Diagnostics-macos-${{ matrix.arch }}
          path: dist/PCTaller-Diagnostics
          if-no-files-found: error
