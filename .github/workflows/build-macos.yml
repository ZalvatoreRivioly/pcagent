name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller websockets psutil

      - name: Compilar binario unico (onefile)
        run: pyinstaller --onefile --windowed --clean --noconfirm --name "PCTaller-Diagnostics" --hidden-import websockets --hidden-import psutil --hidden-import tkinter --hidden-import tkinter.scrolledtext agent_client_macos.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PCTaller-Diagnostics-macos-arm64
          path: dist/PCTaller-Diagnostics
          if-no-files-found: error
